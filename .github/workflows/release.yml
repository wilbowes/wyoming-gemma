name: Release (Docker image)

# A vX.Y.Z tag publishes ghcr.io/<owner>/wyoming-gemma:X.Y.Z and :latest for
# linux/amd64 and linux/arm64. Run by hand, it does everything except publish.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/wyoming-gemma

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pytest wyoming==1.8.0
      - run: python -m pytest tests/ -v

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # provenance attestation
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # git allows $ ( ) ; in a tag name and the version is used in later
      # steps, so anything that is not a plain version stops here. The tag
      # must also be the version the server reports to Home Assistant.
      - name: Version from the tag
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
              echo "::error::tag is not vX.Y.Z"; exit 1; }
            version="${GITHUB_REF_NAME#v}"
            grep -q "version=\"$version\"" shim.py || {
              echo "::error::shim.py does not report version $version"; exit 1; }
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for this runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: wyoming-gemma:smoke

      # The image that is about to be published has to start and answer.
      - name: The image answers Wyoming
        run: |
          docker run -d --name smoke wyoming-gemma:smoke
          sleep 3
          docker exec smoke python3 -c "
          import asyncio
          from wyoming.client import AsyncTcpClient
          from wyoming.info import Describe, Info
          async def main():
              async with AsyncTcpClient('127.0.0.1', 10302) as c:
                  await c.write_event(Describe().event())
                  program = Info.from_event(await c.read_event()).asr[0]
                  print(program.name, program.version)
                  assert program.name == 'gemma-audio'
          asyncio.run(main())"
          docker rm -f smoke

      - name: Log in to GHCR
        if: steps.v.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build both architectures, and push on a tag
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.v.outputs.publish == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.description=Wyoming speech-to-text from Gemma 4's audio input on llama-server
            org.opencontainers.image.licenses=MIT

      - name: Attest build provenance
        if: steps.v.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
